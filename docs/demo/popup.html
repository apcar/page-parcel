<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PageParcel capture modes</title>
    <link rel="stylesheet" href="../../assets/extension/src/shared/tokens.css" />
    <link rel="stylesheet" href="../../assets/extension/src/popup/popup.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 420px;
        min-height: 520px;
        background: #f4f2ed;
      }

      body {
        box-sizing: border-box;
        padding: 30px;
      }

      .app {
        width: 360px;
        border: 1px solid rgba(31, 41, 55, 0.12);
        border-radius: 16px;
        box-shadow: 0 18px 45px rgba(31, 41, 55, 0.18);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <path d="M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12"></path>
            </svg>
          </span>
          <span class="brand-name">PageParcel</span>
        </div>
        <button class="icon-btn" aria-label="Settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </header>
      <nav class="modes" aria-label="Capture modes">
        <button class="mode-card"><span class="mode-icon">📦</span><span class="mode-text"><span class="mode-title">Trace Bundle</span><span class="mode-sub">Screenshot, Markdown, metadata, and hashes</span></span><kbd>⌘⇧1</kbd></button>
        <button class="mode-card"><span class="mode-icon">📄</span><span class="mode-text"><span class="mode-title">Full Page</span><span class="mode-sub">Capture the entire scrollable page</span></span><kbd>⌘⇧2</kbd></button>
        <button class="mode-card"><span class="mode-icon">👁</span><span class="mode-text"><span class="mode-title">Visible Area</span><span class="mode-sub">Capture what is currently visible</span></span><kbd>⌘⇧3</kbd></button>
        <button class="mode-card"><span class="mode-icon">✂️</span><span class="mode-text"><span class="mode-title">Region</span><span class="mode-sub">Select a precise area to capture</span></span><kbd>⌘⇧4</kbd></button>
      </nav>
      <div class="divider"></div>
      <button class="link-btn">Customize keyboard shortcuts</button>
    </main>
  </body>
</html>
