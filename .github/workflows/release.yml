name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: assets/extension/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: assets/extension

      - name: Test, build, and audit
        run: bash scripts/build_extension.sh

      - name: Package extension
        run: bash scripts/package_release.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "release/PageParcel-${GITHUB_REF_NAME#v}.zip"
          "release/PageParcel-${GITHUB_REF_NAME#v}.zip.sha256"
          --title "PageParcel ${GITHUB_REF_NAME#v}"
          --generate-notes
